[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chathsr"
version = "0.1.0"
description = "CLI RAG over ArcaLive Honkai Star Rail info posts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-genai>=1.68,<2",
  "playwright>=1.58,<2",
  "python-dotenv>=1.1,<2",
  "typer>=0.24,<1",
  "websockets>=16,<17",
  "cloudscraper"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
rag = "chathsr.cli:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
